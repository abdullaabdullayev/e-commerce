server:
  port: 8081
  address: 127.0.0.1

spring:
  config:
    import: "optional:file:../.env[.properties],optional:file:./.env[.properties]"
  application:
    name: user-service
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  datasource:
    url: jdbc:postgresql://localhost:5433/user_db
    username: ${USER_DB_USERNAME:${DB_USERNAME}}
    password: ${USER_DB_PASSWORD:${DB_PASSWORD}}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 5s

profiles:
  jwt-secret: ${SECRET_KEY}
  service-key: ${PROFILE_SERVICE_KEY:}
eureka:
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
    instance-id: ${spring.application.name}:${random.value}
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
