server:
  port: 8084
  address: 127.0.0.1
spring:
  config:
    import: "optional:file:../.env[.properties],optional:file:./.env[.properties]"
  application:
    name: inventory-service
  datasource:
    url: ${INVENTORY_DB_URL:jdbc:postgresql://localhost:5434/inventory_db}
    username: ${INVENTORY_DB_USERNAME:${DB_USERNAME}}
    password: ${INVENTORY_DB_PASSWORD:${DB_PASSWORD}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
inventory:
  service-key: ${INVENTORY_SERVICE_KEY:}
  reservation-seconds: 300
eureka:
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
