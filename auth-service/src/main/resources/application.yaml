server:
  port: 8085
  address: 127.0.0.1

spring:
  config:
    import: "optional:file:../.env[.properties],optional:file:./.env[.properties]"
  application:
    name: auth-service
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
    # Demo seeds live in db/demo and load only with the "demo" profile (application-demo.yaml).
    # Seeds applied by older versions came from db/migration; ignore them once they are gone.
    locations: classpath:db/migration
    ignore-migration-patterns: "*:missing"
  jwt:
    secret:  ${SECRET_KEY}
    access-expiration: ${ACCESS_EXPIRATION}
    refresh-expiration: ${REFRESH_EXPIRATION}
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: ${AUTH_DB_USERNAME:${DB_USERNAME}}
    password: ${AUTH_DB_PASSWORD:${DB_PASSWORD}}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  rabbitmq:
    host: localhost
    port: 5672
    connection-timeout: 5s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    
auth:
  bootstrap-key: ${AUTH_BOOTSTRAP_KEY:}
app:
  cors:
    # Comma-separated origins allowed to call Auth directly from a browser.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
eureka:
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
    instance-id: ${spring.application.name}:${random.value}
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
