# Warning!!!
# These usernames and passwords not used in this project.
# It's changed for GitHub push. Please change it duiring installation.

version: '3.8'

services:

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: my_rabbit_user
      RABBITMQ_DEFAULT_PASS: my_rabbit_password
    ports:
      - "5672:5672"
      - "15672:15672"

  postgres-auth:
    image: postgres:16-alpine
    container_name: postgres-auth
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: my_username
      POSTGRES_PASSWORD: my_password

    ports:
      - "5432:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data

  postgres-user:
    image: postgres:16-alpine
    container_name: postgres-user
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: my_username
      POSTGRES_PASSWORD: my_password

    ports:
      - "5433:5432"
    volumes:
      - user_db_data:/var/lib/postgresql/data

volumes:
  auth_db_data:
  user_db_data: