# Only Gateway publishes a host port. Other ports are container-internal.
x-app: &app
  restart: unless-stopped
  networks:
    - backend

x-app-env: &app-env
  SERVER_ADDRESS: 0.0.0.0
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
  EUREKA_INSTANCE_PREFERIPADDRESS: "false"

x-db-env: &db-env
  DB_USERNAME: ${DB_USERNAME:-my_username}
  DB_PASSWORD: ${DB_PASSWORD:-my_password}
  SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-my_username}
  SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-my_password}

x-rabbit-env: &rabbit-env
  SPRING_RABBITMQ_HOST: rabbitmq
  SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-my_rabbit_user}
  SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-my_rabbit_password}

x-postgres: &postgres
  image: postgres:16-alpine
  restart: unless-stopped
  networks:
    - backend
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
    interval: 5s
    timeout: 3s
    retries: 20

services:
  discovery-service:
    <<: *app
    build:
      context: .
      args:
        SERVICE: discovery-service
    environment:
      SERVER_ADDRESS: 0.0.0.0
      EUREKA_INSTANCE_HOSTNAME: discovery-service

  gateway-service:
    <<: *app
    build:
      context: .
      args:
        SERVICE: gateway-service
    environment:
      <<: *app-env
      EUREKA_INSTANCE_HOSTNAME: gateway-service
    ports:
      - "${GATEWAY_BIND_ADDRESS:-127.0.0.1}:${GATEWAY_PORT:-8080}:8080"
    networks:
      - edge
      - backend
    depends_on:
      discovery-service:
        condition: service_started

  auth-service:
    <<: *app
    build:
      context: .
      args:
        SERVICE: auth-service
    environment:
      <<: [*app-env, *db-env, *rabbit-env]
      EUREKA_INSTANCE_HOSTNAME: auth-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/auth_db
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env (at least 32 bytes)}
      SPRING_JWT_SECRET: ${SECRET_KEY:?Set SECRET_KEY in .env (at least 32 bytes)}
      ACCESS_EXPIRATION: ${ACCESS_EXPIRATION:-900000}
      REFRESH_EXPIRATION: ${REFRESH_EXPIRATION:-604800000}
      AUTH_BOOTSTRAP_KEY: ${AUTH_BOOTSTRAP_KEY:-}
    depends_on:
      postgres-auth:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      discovery-service:
        condition: service_started

  user-service:
    <<: *app
    build:
      context: .
      args:
        SERVICE: user-service
    environment:
      <<: [*app-env, *db-env, *rabbit-env]
      EUREKA_INSTANCE_HOSTNAME: user-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-user:5432/user_db
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      PROFILE_SERVICE_KEY: ${PROFILE_SERVICE_KEY:?Set PROFILE_SERVICE_KEY in .env}
    depends_on:
      postgres-user:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      discovery-service:
        condition: service_started

  product-service:
    <<: *app
    build:
      context: .
      args:
        SERVICE: product-service
    environment:
      <<: *app-env
      EUREKA_INSTANCE_HOSTNAME: product-service
      # Override the old localhost host name as well as prefer-ip-address.
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/product_db
      CATALOG_ADMIN_KEY: ${CATALOG_ADMIN_KEY:?Set CATALOG_ADMIN_KEY in .env}
    depends_on:
      mongo:
        condition: service_healthy
      discovery-service:
        condition: service_started

  inventory-service:
    <<: *app
    build:
      context: .
      args:
        SERVICE: inventory-service
    environment:
      <<: [*app-env, *db-env]
      EUREKA_INSTANCE_HOSTNAME: inventory-service
      INVENTORY_DB_URL: jdbc:postgresql://postgres-inventory:5432/inventory_db
      INVENTORY_SERVICE_KEY: ${INVENTORY_SERVICE_KEY:?Set INVENTORY_SERVICE_KEY in .env}
    depends_on:
      postgres-inventory:
        condition: service_healthy
      discovery-service:
        condition: service_started

  order-service:
    <<: *app
    build:
      context: .
      args:
        SERVICE: order-service
    environment:
      <<: [*app-env, *db-env]
      EUREKA_INSTANCE_HOSTNAME: order-service
      ORDER_DB_URL: jdbc:postgresql://postgres-order:5432/order_db
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env (at least 32 bytes)}
      ORDER_SERVICE_KEY: ${ORDER_SERVICE_KEY:?Set ORDER_SERVICE_KEY in .env}
      INVENTORY_SERVICE_KEY: ${INVENTORY_SERVICE_KEY:?Set INVENTORY_SERVICE_KEY in .env}
      PRODUCT_SERVICE_URL: http://product-service:8083
      INVENTORY_SERVICE_URL: http://inventory-service:8084
    depends_on:
      postgres-order:
        condition: service_healthy
      product-service:
        condition: service_started
      inventory-service:
        condition: service_started
      discovery-service:
        condition: service_started

  course-service:
    <<: *app
    build:
      context: .
      args:
        SERVICE: course-service
    environment:
      <<: [*app-env, *db-env]
      EUREKA_INSTANCE_HOSTNAME: course-service
      COURSE_DB_URL: jdbc:postgresql://postgres-course:5432/course_db
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      AUTH_SERVICE_URL: http://auth-service:8085
      PROFILE_SERVICE_URL: http://user-service:8081
      PROFILE_SERVICE_KEY: ${PROFILE_SERVICE_KEY:?Set PROFILE_SERVICE_KEY in .env}
      COURSE_STORAGE_ENDPOINT: http://course-storage:9000
      COURSE_STORAGE_ACCESS_KEY: ${COURSE_STORAGE_ACCESS_KEY:?Set COURSE_STORAGE_ACCESS_KEY in .env}
      COURSE_STORAGE_SECRET_KEY: ${COURSE_STORAGE_SECRET_KEY:?Set COURSE_STORAGE_SECRET_KEY in .env}
      COURSE_STORAGE_BUCKET: course-materials
    depends_on:
      postgres-course:
        condition: service_healthy
      course-storage:
        condition: service_healthy
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
      discovery-service:
        condition: service_started

  course-storage:
    image: chrislusf/seaweedfs:4.53
    command: mini -dir=/data -s3.port=9000 -s3.port.iceberg=0 -s3.port.lance=0
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${COURSE_STORAGE_ACCESS_KEY:?Set COURSE_STORAGE_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${COURSE_STORAGE_SECRET_KEY:?Set COURSE_STORAGE_SECRET_KEY in .env}
    volumes:
      - course_storage_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-my_rabbit_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-my_rabbit_password}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - backend
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  postgres-auth:
    <<: *postgres
    container_name: postgres-auth
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: ${DB_USERNAME:-my_username}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-my_password}
    volumes:
      - auth_db_data:/var/lib/postgresql/data

  postgres-user:
    <<: *postgres
    container_name: postgres-user
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: ${DB_USERNAME:-my_username}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-my_password}
    volumes:
      - user_db_data:/var/lib/postgresql/data

  postgres-inventory:
    <<: *postgres
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: ${DB_USERNAME:-my_username}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-my_password}
    volumes:
      - inventory_db_data:/var/lib/postgresql/data

  postgres-order:
    <<: *postgres
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: ${DB_USERNAME:-my_username}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-my_password}
    volumes:
      - order_db_data:/var/lib/postgresql/data

  postgres-course:
    <<: *postgres
    environment:
      POSTGRES_DB: course_db
      POSTGRES_USER: ${DB_USERNAME:-my_username}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-my_password}
    volumes:
      - course_db_data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    container_name: mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "if (!db.adminCommand({ping:1}).ok) quit(1)"]
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  edge:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  auth_db_data:
  user_db_data:
  rabbitmq_data:
  mongo_data:
  inventory_db_data:
  order_db_data:
  course_db_data:
  course_storage_data:
