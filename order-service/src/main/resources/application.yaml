server:
  port: 8086
  address: 127.0.0.1
spring:
  config:
    import: "optional:file:../.env[.properties],optional:file:./.env[.properties]"
  application:
    name: order-service
  datasource:
    url: ${ORDER_DB_URL:jdbc:postgresql://localhost:5435/order_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  mvc:
    problemdetails:
      enabled: true
orders:
  jwt-secret: ${SECRET_KEY}
  service-key: ${ORDER_SERVICE_KEY:}
  inventory-key: ${INVENTORY_SERVICE_KEY:}
  product-url: ${PRODUCT_SERVICE_URL:http://localhost:8083}
  inventory-url: ${INVENTORY_SERVICE_URL:http://localhost:8084}
eureka:
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
