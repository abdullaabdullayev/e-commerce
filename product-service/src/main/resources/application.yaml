server:
  port: 8083
  address: 127.0.0.1

spring:
  config:
    import: "optional:file:../.env[.properties],optional:file:./.env[.properties]"
  application:
    name: product-service
  mvc:
    problemdetails:
      enabled: true
  data:
    mongodb:
      uri: mongodb://localhost:27017/product_db
      auto-index-creation: true
    web:
      pageable:
        max-page-size: 100

catalog:
  admin-key: ${CATALOG_ADMIN_KEY:}

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}
    ip-address: 127.0.0.1
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
